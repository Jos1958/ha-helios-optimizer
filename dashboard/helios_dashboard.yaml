                  ]);
              - entity: input_number.helios_optimizer_energy_plan
                name: House Usage
                yaxis_id: power
                unit: kW
                show:
                  legend_value: false
                color: '#FF4560'
                type: line
                stroke_width: 3
                data_generator: |
                  const house_array = entity.attributes.plan.house_usage_kw;
                  const stepSize = entity?.attributes?.step_size ?? 0;
                  const half_step_msec = stepSize * 60 * 500;
                  return entity.attributes.plan.timestamp.map((time, i) => [
                    new Date(time).getTime() + half_step_msec, house_array?.[i] != null ? -house_array[i] : null
                  ]);
              - entity: input_number.helios_optimizer_energy_plan
                name: Grid Export
                yaxis_id: power
                unit: kW
                show:
                  legend_value: false
                color: '#ff9800'
                type: line
                opacity: 0.9
                stroke_width: 3
                data_generator: >
                  const imp_array   = entity.attributes.plan.grid_import_kw; 

                  const exp_array   = entity.attributes.plan.grid_export_kw; 

                  const maxLength = Math.max(imp_array?.length || 0,
                  exp_array?.length || 0);      

                  const stepSize = entity?.attributes?.step_size ?? 0;  const
                  half_step_msec = stepSize * 60 * 500;

                  const grid_array = Array.from({ length: maxLength }, (_, i) =>
                  {
                    // Get the value, fallback to 0 if the index not exist or the value is null or undefined
                    const imp_val = imp_array?.[i] ?? 0;
                    const exp_val = exp_array?.[i] ?? 0;
                    return imp_val - exp_val;
                  });

                  return entity.attributes.plan.timestamp.map((time, i) => [
                    // new Date(time).getTime() + half_step_msec, imp_array?.[i] != null && exp_array?.[i] != null ? imp_array[i] - exp_array[i] : null
                    new Date(time).getTime() + half_step_msec, (grid_array?.[i] != null) && (grid_array[i] <= 0) ? grid_array[i] : 0
                  ]);
              - entity: input_number.helios_optimizer_energy_plan
                name: Grid Import
                yaxis_id: power
                unit: kW
                show:
                  legend_value: false
                color: '#4caf50'
                type: line
                opacity: 0.9
                stroke_width: 3
                data_generator: >
                  const colours = { sell: '#ff9800', buy: '#4caf50' }; 

                  const imp_array   = entity.attributes.plan.grid_import_kw; 

                  const exp_array   = entity.attributes.plan.grid_export_kw; 

                  const maxLength = Math.max(imp_array?.length || 0,
                  exp_array?.length || 0);      

                  const stepSize = entity?.attributes?.step_size ?? 0;  const
                  half_step_msec = stepSize * 60 * 500;     

                  const grid_array = Array.from({ length: maxLength }, (_, i) =>
                  {
                    // Get the value, fallback to 0 if the index not exist or the value is null or undefined
                    const imp_val = imp_array?.[i] ?? 0;
                    const exp_val = exp_array?.[i] ?? 0;
                    return imp_val - exp_val;
                  });

                  return entity.attributes.plan.timestamp.map((time, i) => [
                    // new Date(time).getTime() + half_step_msec, imp_array?.[i] != null && exp_array?.[i] != null ? imp_array[i] - exp_array[i] : null
                    new Date(time).getTime() + half_step_msec, (grid_array?.[i] != null) && (grid_array[i] >= 0) ? grid_array[i] : 0
                  ]);
              - entity: input_number.helios_optimizer_energy_plan
                name: EV Charging
                yaxis_id: power
                unit: kW
                show:
                  legend_value: false
                  in_header: false
                color: '#775DD0'
                type: line
                stroke_width: 3
                data_generator: |
                  const ev_array = entity.attributes.plan.ev_charge_kw;
                  const stepSize = entity?.attributes?.step_size ?? 0;
                  const half_step_msec = stepSize * 60 * 500;
                  return entity.attributes.plan.timestamp.map((time, i) => [
                    new Date(time).getTime() + half_step_msec, ev_array?.[i] != null ? ev_array[i] : null
                  ]);
