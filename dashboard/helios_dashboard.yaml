 views:
  - type: sections
    path: helios-controls
    max_columns: 3
    title: Helios Controls
    icon: mdi:shield-sun-outline
    header:
      layout: center
      card:
        type: markdown
        content: |
          ### Helios Controls Dashboard v0.9.3 for {{ user }} 
           
      badges_position: bottom
      badges_wrap: scroll
    badges:
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: input_boolean.house_battery_control_is_debug_mode
        tap_action:
          action: toggle
        name: Insights mode
      - type: shortcut
        tap_action:
          action: navigate
          navigation_path: helios-results
        icon: mdi:shield-star-outline
        text: Helios Detailed Results
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: picture
            image:
              media_content_id: /local/HeliosOptimizerBanner.jpeg
              media_content_type: ''
              metadata:
                navigateIds:
                  - {}
                  - media_content_type: ''
                    media_content_id: __MANUAL_ENTRY__
            grid_options:
              columns: full
            alt_text: Helios Optimizer
            double_tap_action:
              action: perform-action
              perform_action: pyscript.helios_optimizer_automation
              target: {}
      - type: grid
        background:
          color: yellow
          opacity: 16
        column_span: 3
        cards:
          - type: heading
            icon: mdi:calculator-variant
            heading: 'Helios Optimizer: Results Summary'
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#results-summary
          - type: tile
            entity: input_number.helios_optimizer_energy_plan
            name: Result
            icon: mdi:calculator-variant
            card_mod:
              style: |
                ha-tile-icon {
                  --tile-color: {% if state_attr('input_number.helios_optimizer_energy_plan', 'success') == true %} green {% else %} red {% endif %} !important;
                }
            show_entity_picture: true
            hide_state: false
            state_content:
              - success
              - total_fun_cost
              - total_grid_cost
            vertical: false
            features_position: bottom
          - type: tile
            entity: input_number.helios_optimizer_energy_plan
            name: Calculation
            icon: mdi:home-battery
            show_entity_picture: true
            hide_state: false
            state_content:
              - calc_result
              - solver_iterations
            vertical: false
            features_position: bottom
            card_mod:
              style: |
                ha-tile-icon {
                  --tile-color: {% if state_attr('input_number.helios_optimizer_energy_plan', 'success') == true %} green {% else %} red {% endif %} !important;
                }
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: input_number.helios_optimizer_energy_plan
            name: Last Optimization Run
            icon: mdi:shield-sun-outline
            show_entity_picture: true
            hide_state: false
            state_content:
              - last_service_begin
              - calc_exec_time_ms
              - solver_exec_time_ms
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: input_number.helios_optimizer_energy_plan
            name: Optimization Period Start
            icon: mdi:timer-outline
            show_entity_picture: true
            hide_state: false
            state_content:
              - base_step
              - base_time
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: 12
              rows: auto
            entity: input_number.helios_optimizer_energy_plan
            name: Optimization Period Active Step
            icon: mdi:shoe-print
            show_entity_picture: false
            hide_state: false
            state_content:
              - active_step
              - active_time
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: input_number.helios_optimizer_energy_plan
            name: Optimization Period End
            icon: mdi:timer-outline
            show_entity_picture: true
            hide_state: false
            state_content:
              - end_step
              - end_time
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: 12
              rows: auto
            entity: input_number.helios_optimizer_energy_plan
            name: Battery Cap, Start & End (kWh)
            icon: mdi:battery-60
            show_entity_picture: false
            hide_state: false
            state_content:
              - capacity_kwh
              - soc_start_kwh
              - soc_end_kwh
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: 24
              rows: 1
            entity: input_number.helios_optimizer_energy_plan
            name: Solver Status
            icon: mdi:message
            card_mod:
              style: |
                ha-tile-icon {
                  --tile-color: {% if state_attr('input_number.helios_optimizer_energy_plan', 'success') == true %} green {% else %} red {% endif %} !important;
                }
            show_entity_picture: true
            hide_state: false
            state_content: solver_message
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: 12
              rows: auto
            entity: input_number.helios_optimizer_energy_plan
            name: Helios, Python & SciPy Version
            icon: mdi:program
            show_entity_picture: false
            hide_state: false
            state_content:
              - version
              - python
              - scipy
            vertical: false
            features_position: bottom
            visibility:
              - condition: user
                users:
                  - e3660168261a4344a4c14e358c2ba336
                  - 6f5834a212c040e290a60b1b550dbdda
          - type: heading
            icon: mdi:shield-star-outline
            heading: 'Link to Helios Dashboard: Results Details'
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: helios-results
      - type: grid
        column_span: 3
        cards:
          - type: heading
            icon: mdi:information
            heading: 'Helios Optimizer Documentation '
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC
          - type: markdown
            content: >-
              <font color="grey">

              <i>

              The <b>Helios Optimizer Service</b> will typically run every
              <b>quarter</b> of an hour and can be <b>manually</b> started with
              the <b>Start Helios</b> button.

              <br><b>Tip:</b> Use the <b>links</b> above the sections for
              <b>detailed</b> Helios Optimizer Documentation and a description
              of the individual fields.

              </i>

              </font>
            grid_options:
              columns: full
          - type: custom:button-card
            entity: input_boolean.helios_optimizer_running
            name: |
              [[[
                if (entity && entity.state === 'on')
                  return 'Helios Energy Optimizer (Running...)';
                return 'Start Helios Optimizer Task';
              ]]]
            show_icon: false
            grid_options:
              rows: auto
              columns: full
            tap_action:
              action: call-service
              service: pyscript.helios_optimizer_hbc_task
              haptic: heavy
            styles:
              card:
                - background-color: |
                    [[[
                      if (entity && entity.state === 'on')
                        return '#ff9800'; // ORANJE wanneer hij getriggerd wordt
                      return '#2e7d32';   // GROEN in ruststand
                    ]]]
                - color: '#ffffff'
                - font-weight: bold
                - transition: background-color 0.2s ease
        background:
          color: yellow
          opacity: 16
      - type: grid
        column_span: 1
        background:
          color: yellow
          opacity: 16
        cards:
          - type: heading
            icon: mdi:weather-sunny
            heading: Optimization Parameters
            heading_style: subtitle
            grid_options:
              columns: 12
              rows: auto
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#optimization-parameters
          - type: markdown
            content: >-
              <font color="grey"><i>

              The <b>settings</b> below tune how the Helios Optimizer runs. 

              Use <b>48</b> <b>Steps</b> with a <b>Step Size</b> of <b>60min</b>
              and <b>Start Step</b> of <b>0</b> (for <u>automatic</u>) for a
              typical run with a horizon of <b>2 days</b>.

              </i></font>
          - type: entities
            entities:
              - entity: input_number.helios_optimizer_steps
                name: Steps
              - entity: input_select.helios_optimizer_step_size
                name: Step Size (Minutes)
              - entity: input_number.helios_optimizer_start_step
                name: Start Step (0 is Auto)
              - entity: input_number.helios_optimizer_max_grid_import
                name: Max Grid Import
              - entity: input_number.helios_optimizer_max_grid_export
                name: Max Grid Export
              - entity: input_number.helios_optimizer_house_daily_usage
                name: House Daily Usage (Avg)
              - entity: input_text.helios_optimizer_house_daily_distr
                name: House Daily Usage Distribution (24 Hours)
              - entity: input_select.helios_optimizer_solar_mode
                name: Solar Mode
              - entity: input_select.helios_optimizer_solar_source
                name: Solar Forecast Source
      - type: grid
        column_span: 1
        background:
          color: yellow
          opacity: 16
        cards:
          - type: heading
            icon: mdi:battery-charging-80
            heading: Battery Parameters
            heading_style: subtitle
            grid_options:
              columns: 12
              rows: auto
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#battery-parameters
          - type: markdown
            content: >-
              <font color="grey"><i>The <b>settings</b> below tune how the
              Helios Optimizer uses the battery. 

              </i></font>
          - type: entities
            entities:
              - entity: input_boolean.helios_optimizer_battery_enabled
                name: Battery Enabled
              - entity: input_number.helios_optimizer_soc_target_pct
                name: Battery SOC Target
              - entity: input_number.helios_optimizer_soc_min_pct
                name: Battery SOC Min
              - entity: input_number.helios_optimizer_soc_max_pct
                name: Battery SOC Max
              - entity: input_number.helios_optimizer_charge_limit
                name: Battery Charge Limit
              - entity: input_number.helios_optimizer_discharge_limit
                name: Battery Discharge Limit
              - entity: input_number.helios_optimizer_charge_efficiency
                name: Battery Charge Efficiency
              - entity: input_number.helios_optimizer_discharge_efficiency
                name: Battery Discharge Efficiency
      - type: grid
        column_span: 1
        background:
          color: yellow
          opacity: 16
        cards:
          - type: heading
            icon: mdi:battery-charging-high
            heading_style: subtitle
            grid_options:
              columns: 12
              rows: auto
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#actuals-for-current-step
            heading: Actuals for Current Step
          - type: markdown
            content: >-
              <font color="grey"><i>The <b>information</b> below shows the power
              values in the current step.

              </i></font>
          - type: markdown
            content: >
              {%- set c =
              state_attr('input_number.helios_optimizer_energy_plan', 'current')
              -%}

              {%- if c is defined and c is not none -%}
                {%- set step  = state_attr('input_number.helios_optimizer_energy_plan', 'active_step') | default(None) -%}
                {%- set start = state_attr('input_number.helios_optimizer_energy_plan', 'active_time') | default('')  -%}
                🐾 **Active Step:** {{ step }}
                🕰️ **Step Start Time:** {{ start }}
                |Component | State | Power |
                |:--- | :---: | :---: |
                |💎 **Helios Strategy**   | **{{ c.battery_strategy }}**                                       | |
                |♟️ **HBC Sub Strat**     | **{{ c.hbc_sub_strategy }}**                                       | |
                |🔋 **Net Battery**       | {{ '🔻 Discharge' if c.battery_net_power_w  < 0 else ('🔺 Charge' if c.battery_net_power_w > 0 else '⚪ Standby') }} | {{ c.battery_net_power_w }} W |
                |🔌 **Grid Power**        | {{ '🟠 Export'    if c.grid_power_w         < 0 else ('🟢 Import' if c.grid_power_w        > 0 else '⚪ NOM'    ) }} | {{ c.grid_power_w        }} W |
                |☀️ **Solar Production**  | {{ '🟡 Active'    if c.solar_production_w   > 0 else '⚪ Standby' }} | {{ c.solar_production_w  }} W |
                |🏠 **House Usage**       | {{ '🔴 Active'    if c.house_usage_w        > 0 else '⚪ Standby' }} | {{ c.house_usage_w       }} W |  
                |🔸 **Limits:**           | | |
                |🔸 **Charge Limit**      | {{ '🟤 Active'    if c.max_charge_w         > 0 else '⚪ Disabled'}} | {{ c.max_charge_w        }} W |
                |🔸 **Discharge Limit**   | {{ '🟤 Active'    if c.max_discharge_w      > 0 else '⚪ Disabled'}} | {{ c.max_discharge_w     }} W |
                |🔸 **Max Grid Import**   | {{ '🟤 Active'    if c.max_grid_import_w    > 0 else '⚪ Off-Grid'}} | {{ c.max_grid_import_w   }} W |
                |🔸 **Max Grid Export**   | {{ '🟤 Active'    if c.max_grid_export_w    > 0 else '⚪ Disabled'}} | {{ c.max_grid_export_w   }} W |
              {%- elif false -%}  
                |⚡ **Battery Power**     | {{ '⚡ Active'    if c.battery_power_w      > 0 else '⚪ Standby' }} | {{ c.battery_power_w     }} W |
                |🔺 **Charge Power**      | {{ '🔵 Active'    if c.battery_charge_w     > 0 else '⚪ Standby' }} | {{ c.battery_charge_w    }} W |
                |🔻 **Discharge Power**   | {{ '🟣 Active'    if c.battery_discharge_w  > 0 else '⚪ Standby' }} | {{ c.battery_discharge_w }} W |
                |🚗 **EV Laadpaal**       | {{ '⚡ Charge'    if c.ev_power_w           > 0 else '⚪ Off'     }} | {{ c.ev_power_w          }} W |
                |♨️ **Heatpump**          | {{ '🔥 Heat'      if c.hp_power_w           > 0 else '⚪ Off'     }} | {{ c.hp_power_w          }} W |
                |🚿 **Boiler**            | {{ '💧 Heat Up'   if c.boiler_power_w       > 0 else '⚪ Off'     }} | {{ c.boiler_power_w      }} W |
              {%- else -%}

              *No Current Strategy and Power available.*

              {%- endif -%}
      - type: grid
        column_span: 1
        background:
          color: yellow
          opacity: 16
        cards:
          - type: heading
            icon: mdi:battery-charging-80
            heading: Derived Parameters
            heading_style: subtitle
            grid_options:
              columns: 12
              rows: auto
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#derived-parameters
          - type: markdown
            content: >-
              <font color="grey"><i>The read-only <b>settings</b> below are
              derived from (using templates) or generated for <b>HBC</b> and are
              only displayed for validation purposes. 

              </i></font>
          - type: entities
            entities:
              - entity: input_text.helios_optimizer_version
                name: Helios Version
                card_mod:
                  style: |
                    :host{pointer-events: all; opacity: 0.6} 
              - entity: sensor.helios_template_hbc_maximum_energy
                name: Maximum Energy (All Batteries)
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: sensor.helios_template_hbc_remaining_energy
                name: Remaining Energy (All)
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: sensor.helios_template_hbc_total_soc
                name: Total SOC (All)
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: input_select.helios_optimizer_hbc_sub_strategy
                name: HBC Sub Strategy by Helios
                card_mod:
                  style: |
                    :host{pointer-events: all; opacity: 0.6} 
              - entity: input_number.helios_optimizer_hbc_net_power
                name: HBC Net Power for Battery by Helios
                card_mod:
                  style: |
                    :host{pointer-events: all; opacity: 0.6} 
        visibility:
          - condition: state
            entity_id: input_boolean.house_battery_control_is_debug_mode
            state:
              - 'on'
      - type: grid
        column_span: 1
        background:
          color: yellow
          opacity: 16
        cards:
          - type: heading
            icon: mdi:battery-charging-80
            heading: HBC Settings
            heading_style: subtitle
            grid_options:
              columns: 12
              rows: auto
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#hbc-settings
          - type: markdown
            content: >-
              <font color="grey"><i>These settings are determined by or
              configured in <b>HBC</b>.</i></font>
          - type: entities
            entities:
              - entity: input_number.house_battery_count
                name: Battery Count
                card_mod:
                  style: |
                    :host {
                      pointer-events: none; /* Blokkeert alle muisklikken */
                      opacity: 0.6;         /* Maakt het veld grijs/read-only */
                    }
              - entity: input_number.house_battery_total_max_available_energy
                name: Maximum Energy
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: input_number.house_battery_total_available_energy
                name: Available Energy
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: input_number.house_battery_total_battery_power
                name: Battery Power
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: sensor.helios_template_hbc_max_charge_power
                name: Max Charge Power (All)
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: sensor.helios_template_hbc_max_discharge_power
                name: Max Discharge Power (All)
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: input_number.house_battery_strategy_sell_target_soc
                name: HBC Sell Target SOC %
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
              - entity: input_number.house_battery_strategy_charge_target_soc
                name: HBC Charge Target SOC %
                card_mod:
                  style: |
                    :host{pointer-events: none; opacity: 0.6} 
        visibility:
          - condition: state
            entity_id: input_boolean.house_battery_control_is_debug_mode
            state:
              - 'on'
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            content: Als deze tekst **ROOD** is, werkt card-mod!
            card_mod:
              style: |
                ha-card {
                  color: red !important;
                }
            grid_options:
              columns: full
            visibility:
              - condition: user
                users:
                  - aeb5f377cffb469180f9b97c7136f6ae
    cards: []
  - type: sections
    path: helios-results
    max_columns: 3
    title: Helios Detailed Results
    icon: mdi:shield-star-outline
    header:
      layout: center
      card:
        type: markdown
        content: |
          ### Helios Detailed Results Dashboard v0.9.3 for {{ user }}
      badges_position: bottom
      badges_wrap: scroll
    badges:
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: input_boolean.house_battery_control_is_debug_mode
        tap_action:
          action: toggle
        name: Insights mode
      - type: shortcut
        tap_action:
          action: navigate
          navigation_path: helios-controls
        icon: mdi:shield-sun-outline
        text: Helios Controls
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: picture
            image:
              media_content_id: /local/HeliosOptimizerBanner.jpeg
              media_content_type: ''
              metadata:
                navigateIds:
                  - {}
                  - media_content_type: ''
                    media_content_id: __MANUAL_ENTRY__
            grid_options:
              columns: full
            alt_text: Helios Optimizer
            double_tap_action:
              action: perform-action
              perform_action: pyscript.helios_optimizer_automation
              target: {}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            icon: mdi:information
            heading: 'Helios Optimizer: Prices and Strategy Graph'
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#prices-and-strategy-graph
          - type: custom:apexcharts-card
            section_mode: true
            grid_options:
              columns: full
              rows: 10
            header:
              show: true
              show_states: false
              title: Helios Prices and Strategy Graph
            span:
              start: day
            graph_span: 48h
            now:
              show: true
              color: '#009ac7'
              label: Now
            apex_config:
              plotOptions:
                bar:
                  borderRadius: 2
                  columnWidth: 90%
              legend:
                show: true
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  rotate: -35
                  offsetY: -3
                  rotateAlways: true
              yaxis:
                decimalsInFloat: 1
                title:
                  text: cent / kWh
              noData:
                text: No Energy Plan Data Available
                align: center
                verticalAlign: middle
                style:
                  color: '#888888'
                  fontSize: 14px
              tooltip:
                x:
                  format: dddd dd MMMM yyyy - HH:mm
            series:
              - entity: input_number.helios_optimizer_energy_plan
                name: Strategy
                type: line
                stroke_width: 0
                color: transparent
                unit: " "
                show:
                  legend_value: false
                data_generator: >
                  const plan = entity?.attributes?.plan ?? null;    

                  if (!plan || !plan.timestamp) return [];

                  const hbc_strat_array = plan.hbc_sub_strat;

                  const step_size = entity?.attributes?.step_size ?? 0;

                  const half_step_msec = step_size * 60 * 500; // 1/2 step in
                  msec

                  // Function to Convert a HBC Sub Strategy to a number:  

                  const mapStrToInt = (str) => {
                    switch(str) {
                      case 'Skipped'             : return 0;  // Sell and Discharge
                      case 'Sell'                : return 1;  // Sell and Discharge
                      case 'Charge'              : return 2;  // Buy and Charge
                      case 'Charge PV'           : return 3;
                      case 'Self-consumption'    : return 4;
                      case 'Zero import'         : return 5;
                      case 'Standby / peak shave': return 8;
                      default: return 9; // Default (e.g. Other)
                    }
                  };

                  return plan.timestamp.map((time, i) => {
                    const hbc_sub_strat = hbc_strat_array[i] ?? "Other";

                    return {
                      x: new Date(time).getTime() + half_step_msec, 
                      y: mapStrToInt(hbc_sub_strat), // Convert the HBC Sub Strategy to a number
                      fillColor: '#ff0000'
                    };
                  });
              - entity: input_number.helios_optimizer_energy_plan
                name: Import Price
                type: column
                float_precision: 1
                color: grey
                unit: ct/kWh
                show:
                  legend_value: false
                data_generator: >
                  const colours = {
                    'Skipped': '#e0e0e0', // Light Grey
                    'Sell': '#ff9800', // Orange
                    'Discharge': '#9c27b0', // Purple
                    'Buy': '#4caf50',  // Dark Green
                    'Charge': '#8bc34a', // Light Green
                    'Charge Solar': '#cddc39', // Yellow
                    'NOM': '#00bcd4', // Light Blue
                    'NOM-C': '#009688', // Blue-Green
                    'NOM-D': '#3f51b5', // Blue-Purple
                    'Disabled': '#9e9e9e', // Dark Grey
                    'Other': '#FF0000' // Red (Invalid Strategy)
                  }; 

                  const hbc_cols = {
                    'Skipped': '#E0E0E0', // Light Grey
                    'Sell': '#FF9800', // Orange
                    'Charge': '#4CAF50', // Green
                    'Charge PV': '#CDDC39', // Yellow
                    'Self-consumption': '#00BCD4', // Light Blue
                    'Zero import': '#3f51b5', // Blue-Purple
                    'Standby / peak shave': '#9E9E9E', // Dark Grey
                    'Other': '#FF0000' // Red (Invalid sub-strat)
                  }; 

                  const plan = entity?.attributes?.plan ?? null;    

                  const step_size = entity?.attributes?.step_size ?? 0;

                  const half_step_msec = step_size * 60 * 500; // 1/2 step in
                  msec

                  if (!plan || !plan.timestamp)  return [];

                  const imp_array   = plan.import_prices || [];

                  const exp_array   = plan.export_prices || [];   

                  const strat_array   = plan.strategy      || [];

                  const hbc_strat_array = plan.hbc_sub_strat || [];

                  return plan.timestamp.map((time, i) => {
                    const strat   = strat_array[i]   ?? "Other";
                    const hbc_strat = hbc_strat_array[i] ?? "Other";
                    const imp = 100 * (imp_array[i] ?? 0);
                    
                    return {
                      x: new Date(time).getTime() + half_step_msec, 
                      y: imp,
                      // fillColor: '#008FFB' // Fixed Colour
                      // fillColor: colours[strat] || colours['Other'] // Use Strategy to pick the colouor
                      fillColor: hbc_cols[hbc_strat] || hbc_cols['Other'] // Use HBC Sub Strategy to pick the colour
                    };
                  });
