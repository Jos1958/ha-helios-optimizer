                | **House Skipped**       | {{ '%5.2f' | format(t.get('house_skipped_kwh'    ) or 0) }} kWh |
              {%- else -%}

              *No Totals available.*

              {%- endif -%}
                
            title: Energy Plan Totals
        column_span: 3
        background:
          color: yellow
          opacity: 16
        visibility:
          - condition: state
            entity_id: input_boolean.house_battery_control_is_debug_mode
            state:
              - 'on'
      - type: grid
        cards:
          - type: heading
            icon: mdi:information
            heading: 'Helios Optimizer: Optimal Energy Plan'
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#optimal-energy-plan-table
          - type: markdown
            title: Optimal Energy Plan Table
            content: >
              {%- set hdr1 = "| Start Time | Import (€) | Export (€) | Market
              (€) | FunCost (€) | House-For (kW) | House-Usg (kW) | Sun-For (kW)
              | Sun-Prod (kW) | Strategy | HBC Sub Strat | SoC (%) | SoC (kWh) |
              Grid-Net (kW) | Discharge (kW) | Charge (kW) |" -%}

              {%- set hdr2 = "| :--- |       ---: |       ---: |       ---:
              |        ---: |      :---:     |    :---:       |    :---:    
              |     :---:     |   :---:  |      :---:    |  :---:  |   :---:  
              |     :---:     |     :---:      |     :---:   |" -%}

              {%- set p =
              state_attr('input_number.helios_optimizer_energy_plan', 'plan')
              -%}

              {%- if p and p.timestamp is defined and  p.timestamp | length > 0
              -%}
                {%- if p.ev_charge_kw != None -%}
                  {%- set hdr1 = hdr1 ~ " EV Charging (kW) |" -%} 
                  {%- set hdr2 = hdr2 ~ " :---:            |" -%} 
                {%- endif -%}
                {{ hdr1 }} 
                {{ hdr2 }}
                {%- for i in range(p.timestamp | length) -%}
                  {%- set t = p.timestamp[i].split(' ')[1][:5] -%}
                  {%- set imp_pr       = "%5.3f"| format(p.import_prices[i]) -%}
                  {%- set exp_pr       = "%5.3f"| format(p.export_prices[i]) -%}
                  {%- set mar_pr       = "%5.3f"| format(p.market_prices[i]) if (p.market_prices != None) else 'n/a' -%}
                  {%- set step_cost    = "%5.3f"| format(p.step_costs[i]) -%}
                  {%- set house_for_kw = "%6.3f"| format(p.house_forecast_kw[i]) -%}
                  {%- set house_usg_kw = "%6.3f"| format(p.house_usage_kw[i]) -%}
                  {%- set sol_for_kw   = "%6.3f"| format(p.solar_forecast_kw[i]) -%}     
                  {%- set sol_prod_kw  = "%6.3f"| format(p.solar_production_kw[i]) -%}     
                  {%- set soc_pct      = "%4.1f"| format(p.soc_pct[i]) -%}
                  {%- set soc_kwh      = "%5.2f"| format(p.soc_kwh[i]) -%}
                  {%- set grid_net_kw  = "%5.2f"| format(p.grid_import_kw[i] - p.grid_export_kw[i]) -%}
                  {%- set helios_strat = p.strategy[i] -%}
                  {%- set hbc_sub_strat= p.hbc_sub_strat[i] -%}

                  {%- set discharge_kw = "%6.3f"| format(p.battery_discharge_kw[i] if p.battery_discharge_kw != None else 0) -%}
                  {%- set charge_kw    = "%6.3f"| format(p.battery_charge_kw[i] if p.battery_charge_kw != None else 0) -%}
                  
                  {%- set ev_kw        = "%6.3f"| format(p.ev_charge_kw[i] if p.ev_charge_kw != None else 0) -%}
                  {%- set hp_kw        = "%6.3f"| format(p.heat_pump_kw[i] if p.heat_pump_kw != None else 0) -%}
                  {%- set boiler_kw    = "%6.3f"| format(p.boiler_kw[i] if p.boiler_kw != None else 0) -%}
                  
                  {%- set row = "\n|" ~ t -%}
                  {%- set row = row ~ "|" ~ imp_pr ~ "|" ~ exp_pr ~ "|" ~ mar_pr -%} 
                  {%- set row = row ~ "|" ~ step_cost -%} 
                  {%- set row = row ~ "|" ~ house_for_kw -%} 
                  {%- set row = row ~ "|" ~ house_usg_kw -%} 
                  {%- set row = row ~ "|" ~ sol_for_kw -%}
                  {%- set row = row ~ "|" ~ sol_prod_kw -%}
                  {%- set row = row ~ "|" ~ helios_strat -%}
                  {%- set row = row ~ "|" ~ hbc_sub_strat -%}
                  {%- set row = row ~ "|" ~ soc_pct  ~ "|" ~  soc_kwh ~ "|" ~ grid_net_kw -%}
                  {%  set row = row ~ "|" ~ discharge_kw ~ "|" ~ charge_kw -%}
                  {%- set row = row ~ "|" ~ (ev_kw if p.ev_charge_kw != None else "n/a") -%}
                  {%- set row = row ~ "|" -%}
                  {{- row -}}  
                {%- endfor -%}
              {%- else -%}
                {{ "\n\n**No Optimal Energy Plan Data Available.**" }}
              {%- endif -%}
            grid_options:
              columns: full
        column_span: 3
        background:
          color: yellow
          opacity: 16
    cards: []
