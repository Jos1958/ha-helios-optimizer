              action: url
              url_path: https://jos1958.github.io/ha-helios-optimizer/DOC#optimal-energy-plan-graph
          - type: custom:apexcharts-card
            card_mod:
              style: |
                ha-card {
                  width: 100%;
                }
            section_mode: true
            grid_options:
              columns: full
              rows: 10
            header:
              show: true
              title: Optimal Energy Plan Graph
              show_states: false
              colorize_states: true
            span:
              start: day
            graph_span: 48h
            now:
              show: true
              color: '#009ac7'
              label: Now
            apex_config:
              grid:
                padding:
                  left: 10
                  right: 10
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  rotate: -35
                  offsetY: -3
                  rotateAlways: true
              noData:
                text: No Energy Plan Data Available
                align: center
                verticalAlign: middle
                style:
                  color: '#888888'
                  fontSize: 14px
              tooltip:
                x:
                  format: dddd dd MMMM yyyy - HH:mm
                'y':
                  decimals: 3
            yaxis:
              - id: power
                decimals: 1
                apex_config:
                  tickAmount: 5
                  title:
                    text: Power (kW)
              - id: soc
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: Battery SOC (%)
            series:
              - entity: input_number.helios_optimizer_energy_plan
                name: Battery SoC
                yaxis_id: soc
                unit: '%'
                show:
                  legend_value: false
                color: black
                type: line
                stroke_width: 3
                data_generator: >
                  const pct_array = entity.attributes.plan.soc_pct;

                  const stepSize = entity?.attributes?.step_size ?? 0;

                  const half_step_msec = stepSize * 60 * 500; // SOC is for the
                  end of the step but then the series are no longer combined in
                  the legenda

                  return entity.attributes.plan.timestamp.map((time, i) => [
                    new Date(time).getTime() + half_step_msec, pct_array?.[i] != null ? pct_array[i] : null
                  ]);
              - entity: input_number.helios_optimizer_energy_plan
                name: Battery (Discharge-Charge)
                yaxis_id: power
                unit: kW
                show:
                  legend_value: false
                color: '#000FFB'
                type: area
                stroke_width: 2
                data_generator: |
                  const dis_array = entity.attributes.plan.battery_discharge_kw;
                  const cha_array = entity.attributes.plan.battery_charge_kw;
                  const stepSize = entity?.attributes?.step_size ?? 0;
                  const half_step_msec = stepSize * 60 * 500; 
                  return entity.attributes.plan.timestamp.map((time, i) => [
                    new Date(time).getTime() + half_step_msec, dis_array?.[i] != null ? dis_array[i] - cha_array[i] : null
                  ]);
              - entity: input_number.helios_optimizer_energy_plan
                name: Solar Forecast
                yaxis_id: power
                unit: kW
                show:
                  legend_value: false
                color: '#ffec39'
                type: area
                opacity: 0.1
                stroke_width: 2
                data_generator: |
                  const for_array = entity.attributes.plan.solar_forecast_kw;
                  const stepSize = entity?.attributes?.step_size ?? 0;
                  const half_step_msec = stepSize * 60 * 500;
                  return entity.attributes.plan.timestamp.map((time, i) => [
                    new Date(time).getTime() + half_step_msec, for_array?.[i] != null ? for_array[i] : null
                  ]);
              - entity: input_number.helios_optimizer_energy_plan
                name: Solar Production
                yaxis_id: power
                unit: kW
                show:
                  legend_value: false
                color: '#cddc39'
                type: area
                opacity: 0.3
                stroke_width: 2
                data_generator: |
