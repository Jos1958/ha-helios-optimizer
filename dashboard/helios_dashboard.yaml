                data_generator: >
                  const plan = entity?.attributes?.plan ?? null;    

                  const step_size = entity?.attributes?.step_size ?? 0;

                  const half_step_msec = step_size * 60 * 500; // 1/2 step in
                  msec

                  if (!plan || !plan.timestamp)  return [];

                  const exp_array = plan.export_prices || [];   

                  return plan.timestamp.map((time, i) => {
