###########################################################################################################
# HOME ASSISTANT RECORDER: EXCLUDES
###########################################################################################################
recorder:
  exclude:
    entities:
      # Exclude the Helios Energy Plan from the Home Assistant Recorder since it contains high volume attributes
      - input_number.helios_optimizer_energy_plan

      # Exclude the forecast solar raw data (Wh) and hours data (kWh) from the Home Assistant Recorder since they contain high volume attributes
      - sensor.helios_optimizer_forecast_solar_raw
      - sensor.helios_optimizer_forecast_solar_hours
      - pyscript.helios_optimizer_forecast_solar_hours

      # Exclude the forecast solar and house history data the Home Assistant Recorder since it contains high volume attributes
      - pyscript.helios_optimizer_history

###########################################################################################################
# INPUT_NUMBER
###########################################################################################################
input_number:
  # Helios Optimizer Output and Input Entities:
  helios_optimizer_energy_plan:
    # Output Entity for the Helios Optimizer with the calculated Energy Plan
    # The Total (Fun) Cost will be in the state value
    # The Plan Arrays and Other output parameters are in the attributes.
    # IMPORTANT: Exclude this entity from the recorder since the attribute size can be VERY large!
    name: "Helios Optimizer Energy Plan"
    icon: mdi:currency-eur
    min: -1000
    max: +1000
    step: 0.01    
    initial: 0.00
    unit_of_measurement: "€"
    mode: box
 
  helios_optimizer_steps:
    # Input Entity for the Number of Steps of the Helios Optimizer when calculating the Energy Plan
    # 24, 48, 96 or 192 (other values are supported but less valuable)
    # Advised values: steps x step_size =  1 or 2 days
    name: "Helios Optimizer Steps"
    icon: mdi:shoe-print
    min: 24
    max: 192
    step: 24    
    #initial: 0
    unit_of_measurement: ""
    mode: box

  helios_optimizer_start_step:
    # Input Entity for the Start Step of the Helios Optimizer when calculating the Energy Plan
    # 0 = Start automatically at the beginning of current hour or quarter,
    # Must be an integer value below or equal to the number of steps in the optimization period
    name: "Helios Optimizer Start Step"
    icon: mdi:foot-print
    min: 0
    max: 192
    step: 1    
    #initial: 0
    unit_of_measurement: ""
    mode: box

  helios_optimizer_house_daily_usage:
    # Input Entity for the Usage in the House for a single day (excluding deferrable loads like EV, HP, Boiler)
    name: "Helios Optimizer Average House Daily Energy Usage"
    unit_of_measurement: "kWh"
    icon: mdi:counter  
    min: 0.0
    max: 200.0
    step: 0.1    
    #initial: 10.0
    mode: box

  helios_optimizer_max_grid_import:
    # Input Entity for the Maximum Grid Import for the Helios Optimizer when calculating the Energy Plan
    name: "Helios Optimizer Max Grid Import"
    unit_of_measurement: "kW"
    icon: mdi:flash  
    min: 0.0
    max: 25.0
    step: 0.1    
    #initial: 9.0
    mode: box

  helios_optimizer_max_grid_export:
    # Input Entity for the Maximum Grid Export for the Helios Optimizer when calculating the Energy Plan
    name: "Helios Optimizer Max Grid Export"
    unit_of_measurement: "kW"
    icon: mdi:flash  
    min: 0.0
    max: 25.0
    step: 0.1    
    #initial: 9.0
    mode: box

  helios_optimizer_soc_target_pct:
    # Input Entity for the Target State of Charge (SOC) of the Battery for the Helios Optimizer when calculating the Energy Plan
    # Note: Currently Helios Optimizer only supports a single (total) battery 
    # Remark: This is the target SOC for the end of the optimization period (e.g. end of day/24h or end of 2 days/48h)
    name: "Helios Optimizer Target SOC"
    icon: mdi:battery-40    
    min: 0
    max: 100
    step: 1    
    #initial: 45
    unit_of_measurement: "%"
    mode: box

  helios_optimizer_soc_min_pct:
    # Input Entity for the Minimum State of Charge (SOC) of the Battery for the Helios Optimizer when calculating the Energy Plan
    # Note: Currently Helios Optimizer only supports a single (total) battery 
    # Warning: Only used when the HBC entity (input_number.house_battery_strategy_sell_target_soc) is not applicable
    name: "Helios Optimizer Minimum SOC"
    icon: mdi:battery-10    
    min: 0
    max: 100
    step: 1    
    #initial: 10
    unit_of_measurement: "%"
    mode: box

  helios_optimizer_soc_max_pct:
    # Input Entity for the Maximum State of Charge (SOC) of the Battery for the Helios Optimizer when calculating the Energy Plan
    # Note: Currently Helios Optimizer only supports a single (total) battery 
    # Warning: Only used when the HBC entity (input_number.house_battery_strategy_charge_target_soc) is not applicable
    name: "Helios Optimizer Maximum SOC"
    icon: mdi:battery-90    
    min: 0
    max: 100
    step: 1    
    #initial: 90
    unit_of_measurement: "%"
    mode: box

  helios_optimizer_charge_limit:
    # Input Entity for the Charge Limit of the Battery for the Helios Optimizer when calculating the Energy Plan
    # Note: Currently Helios Optimizer only supports a single (total) battery 
    name: "Helios Optimizer Charge Limit"
    unit_of_measurement: "kW"
    icon: mdi:flash  
    min: 0.0
    max: 20.0
    step: 0.1    
    #initial: 1.2
    mode: box

  helios_optimizer_discharge_limit:
    # Input Entity for the Discharge Limit of the Battery for the Helios Optimizer when calculating the Energy Plan
    # Note: Currently Helios Optimizer only supports a single (total) battery 
    name: "Helios Optimizer Discharge Limit"
    unit_of_measurement: "kW"
    icon: mdi:flash  
    min: 0.0
    max: 20.0
    step: 0.1    
    #initial: 0.8
    mode: box

  helios_optimizer_charge_efficiency:
    # Input Entity for the Charge Efficiency of the Battery for the Helios Optimizer when calculating the Energy Plan
    # Remark: Return Time Efficiency (RTE) is Charge-Efficiency * Discharge-Efficiency
    # Note: Currently Helios Optimizer only supports a single (total) battery 
    name: "Helios Optimizer Charge Efficiency"
    icon: mdi:gauge    
    min: 0.700
    max: 1
    step: 0.001    
    #initial: 0.950
    unit_of_measurement: ""
    mode: box

  helios_optimizer_discharge_efficiency:
    # Input Entity for the Discharge Efficiency of the Battery for the Helios Optimizer when calculating the Energy Plan
    # Remark: Return Time Efficiency (RTE) is Charge-Efficiency * Discharge-Efficiency
    # Note: Currently Helios Optimizer only supports a single (total) battery 
    name: "Helios Optimizer Discharge Efficiency"
    icon: mdi:gauge    
    min: 0.700
    max: 1
    step: 0.001    
    #initial: 0.950
    unit_of_measurement: ""
    mode: box

  helios_optimizer_hbc_net_power:
  # Defines the Current Battery Power that should be applied by the Helios Strategy in the HBC Node-Red Flow
  # Output from the Helios Optimizer and Input for the HBC Helios Strategy (Charge is Positive, Discharge is Negative)
  # Initialized to 0 after a restart of Home Assistant (will be set by Helios again automatically)
    name: "Helios Optimizer Current Net Battery Power for HBC"
    unit_of_measurement: "W"
    icon: mdi:flash  
    min: -20000
    max: 20000
    step: 1    
    initial: 0
    mode: box

# helios_optimizer_step_size:
#   # Input Entity for the Step Size in minutes of the Helios Optimizer when calculating the Energy Plan
#   # 15, 30 or 60 (other values (e.g. 45 are supported but less valuable)
#   # Advised values: steps x step_size =  1 or 2 days
#   name: "Helios Optimizer Step Size"
#   icon: mdi:clock-fast
#   min: 15
